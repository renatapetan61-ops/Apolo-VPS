[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apolo-vps-api"
version = "0.1.0"
description = "APOLO VPS control-plane API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apolo_vps*"]